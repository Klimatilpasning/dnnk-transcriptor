name: TEST YouTube-undertekster fra GitHub

# Engangs-diagnostik: kan GitHub Actions' IP'er hente YouTube-undertekster,
# eller blokerer YouTube dem som bots? Slettes når svaret er kendt.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Test underteksthentning
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, '.')
          from fetch_youtube_subs import fetch_subs, parse_vtt, to_dnnk_format
          # KGQ1EZ4SEvU har verificeret danske auto-undertekster
          vtt = fetch_subs("KGQ1EZ4SEvU")
          if vtt:
              t = to_dnnk_format(parse_vtt(vtt))
              print(f"RESULTAT: VIRKER — {len(t)} tegn hentet fra GitHub-runner")
              print(t[:200])
          else:
              print("RESULTAT: BLOKERET — YouTube afviser GitHub-runnerens IP")
              sys.exit(1)
          EOF
